<style>
/* Night-navigation guide: a navy chart-room hero with a brass compass, then a margin column of headings beside the working content. Brass marks the brand, red marks risk, green/amber/red only mean status. */
:root{
  --paper:#FFFFFF; --sheet:#FFFFFF; --wash:#F2F4F8; --ink:#111A2C; --soft:#4D5872; --rule:#E1E5ED;
  --navy:#13213A; --brass:#8A6413; --needle:#D9472F;
  --go:#1E7A4C; --ask:#9A6400; --stop:#BF3529;
  --h-bg:#0E1C33; --h-ink:#F3EFE4; --h-soft:#AEB8CC; --h-line:rgba(226,180,86,.22); --h-brass:#E2B456; --h-face:#132744;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0A1220; --sheet:#101A2D; --wash:#152139; --ink:#E9EDF5; --soft:#9AA6BE; --rule:#22304B;
  --navy:#E9EDF5; --brass:#E2B456; --needle:#FF7558; --go:#5BD08F; --ask:#F0B54A; --stop:#FF8A7E;
  --h-bg:#060D19; --h-face:#0F1E36; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0A1220; --sheet:#101A2D; --wash:#152139; --ink:#E9EDF5; --soft:#9AA6BE; --rule:#22304B;
  --navy:#E9EDF5; --brass:#E2B456; --needle:#FF7558; --go:#5BD08F; --ask:#F0B54A; --stop:#FF8A7E;
  --h-bg:#060D19; --h-face:#0F1E36; color-scheme:dark }
html[dir="rtl"]{
  --serif:"Noto Naskh Arabic", "Traditional Arabic", serif;
  --sans:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --mono:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6;padding-inline:16px;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{line-height:1.85}
.page{max-width:68rem;margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:clamp(1.55rem,2.6vw,2rem);line-height:1.15}
h3{font-size:1.12rem;line-height:1.3}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{line-height:1.55}
p{margin:0}
.muted{color:var(--soft)}
a{color:inherit;text-decoration-color:var(--brass);text-decoration-thickness:1.5px;text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button{font:inherit;color:inherit}
sup.ref{font-size:.68em;line-height:0;margin-inline-start:1px}
sup.ref a{color:var(--brass);text-decoration:none;font-weight:700;font-family:"Public Sans",sans-serif;padding-inline:1px}
sup.ref a:hover{text-decoration:underline}
.skip{position:absolute;inset-inline-start:16px;top:-3rem;background:var(--ink);color:var(--paper);padding:.5rem .9rem;border-radius:var(--r);z-index:20}
.skip:focus{top:.5rem}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *,*::before{animation:none!important;transition:none!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:1.5rem;padding-block:.7rem}
.mark{display:flex;align-items:center;gap:.55rem;text-decoration:none;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.12rem}
.mark svg{width:24px;height:24px;flex:none}
.nav{display:flex;gap:1.25rem;margin-inline-start:auto;overflow-x:auto;min-width:0;scrollbar-width:none}
.nav a{color:var(--soft);text-decoration:none;font-size:.9rem;white-space:nowrap;padding-block:.35rem;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.switches{display:flex;gap:.25rem;flex:none}
.switch{background:none;border:1px solid var(--rule);border-radius:var(--r);padding:.3rem .7rem;font-size:.85rem;cursor:pointer;min-height:2.1rem}
.switch:hover{border-color:var(--ink)}
.switch:active{transform:translateY(1px)}
#langBtn{font-family:"IBM Plex Sans Arabic","Public Sans",sans-serif}
@media (max-width:860px){.top-in{flex-wrap:wrap;row-gap:.25rem}.nav{order:3;flex-basis:100%;margin-inline-start:0}.switches{margin-inline-start:auto}}

/* hero band */
.band{background:var(--h-bg);color:var(--h-ink);margin-inline:-16px;padding-inline:16px;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--h-line) 1px,transparent 1px),linear-gradient(90deg,var(--h-line) 1px,transparent 1px);background-size:72px 72px;opacity:.35;mask-image:linear-gradient(to bottom,#000 30%,transparent)}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:3rem;align-items:center;padding-block:4.25rem 3.75rem}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.3rem);line-height:1.04;letter-spacing:-.018em;margin-block:.9rem 1.2rem}
html[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.45}
.hero h1 span{color:var(--h-brass)}
.kicker{font-size:.95rem;font-weight:600;color:var(--h-brass)}
.lede{font-size:1.1rem;max-width:36rem;color:var(--h-soft)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:1.4rem;margin-top:2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.9rem;padding-inline:1.3rem;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--soft);border-color:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.quiet{background:none;color:var(--ink);border-color:var(--rule)}
.btn.quiet:hover{border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.brass{background:var(--h-brass);border-color:var(--h-brass);color:#0E1C33}
.btn.brass:hover{background:#F0C873;border-color:#F0C873}
.band .textlink{color:var(--h-ink);font-weight:600;text-decoration-color:var(--h-brass)}
.targets{margin-top:1.8rem;font-size:.92rem;color:var(--h-soft);max-width:36rem;padding-top:1.2rem;border-top:1px solid var(--h-line)}
.targets b{color:var(--h-ink);font-variant-numeric:tabular-nums}
figure.dial{margin:0;display:grid;gap:.8rem;justify-items:center}
.dial svg{width:100%;max-width:19rem;height:auto}
.dial figcaption{font-size:.88rem;color:var(--h-soft);text-align:center;max-width:19rem;min-height:2.8em}
#needle{transform-origin:120px 120px;transition:transform 1.2s cubic-bezier(.25,1.2,.4,1)}
#needle.idle{animation:sway 3.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(var(--a2))}}
.dial .bezel{fill:none;stroke:var(--h-brass);stroke-width:1;opacity:.5}
.dial .face{fill:var(--h-face);stroke:var(--h-brass);stroke-width:1.5}
.dial .tk{stroke:var(--h-soft);stroke-width:.8;opacity:.7}
.dial .tk.big{stroke:var(--h-brass);stroke-width:1.8;opacity:1}
.dial text{font-family:"IBM Plex Mono",monospace;font-size:12px;fill:var(--h-ink);text-anchor:middle;dominant-baseline:middle}
.dial .cap{font-family:var(--sans);font-size:10px;font-weight:600;fill:var(--h-brass)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:2.75rem;gap:2rem}.dial svg{max-width:13rem}}

.grounded{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;align-items:baseline;padding-block:1.1rem;border-bottom:1px solid var(--rule);font-size:.88rem;color:var(--soft)}
.grounded strong{color:var(--ink);font-weight:600}

/* sections */
.sec{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:1.5rem 4rem;padding-block:3.75rem;border-top:1px solid var(--rule);scroll-margin-top:4.5rem}
.sec:first-of-type{border-top:0}
.sec-head{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 5rem);display:grid;gap:.7rem}
.sec-head p{font-size:.93rem;color:var(--soft)}
.sec-body{min-width:0}
@media (max-width:860px){.sec{grid-template-columns:1fr;padding-block:2.75rem}.sec-head{position:static}}

/* self-check */
.qs{list-style:none;margin:0;padding:0;counter-reset:q}
.qs > li{counter-increment:q;padding-block:1.4rem;border-bottom:1px solid var(--rule)}
.qs > li:first-child{padding-top:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{display:flex;gap:.8rem;font-weight:600;padding:0;margin-bottom:.75rem}
legend::before{content:counter(q);font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--brass);min-width:1.2rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem .6rem;margin-inline-start:1.4rem;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--wash)}
.opt:has(input:checked){border-color:var(--rule);background:var(--wash)}
.opt input{margin-top:.38rem;accent-color:var(--ink);flex:none}
.opt.right{background:color-mix(in srgb,var(--go) 13%,transparent);border-color:transparent}
.opt.miss{background:color-mix(in srgb,var(--stop) 11%,transparent);border-color:transparent}
.opt:has(input:disabled){cursor:default}
.mark-label{font-size:.78rem;font-weight:700;margin-inline-start:auto;padding-inline-start:.8rem;white-space:nowrap}
.why{margin:.6rem 0 0;margin-inline-start:2rem;font-size:.93rem;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1.5rem}
.count{font-size:.88rem;color:var(--soft);font-variant-numeric:tabular-nums}
.warn{color:var(--stop);font-size:.92rem}
.tally{display:flex;flex-wrap:wrap;margin:1.75rem 0 0;border-block:1px solid var(--rule)}
.tally div{padding:.9rem 1.5rem .9rem 0;display:grid}
.tally div + div{border-inline-start:1px solid var(--rule);padding-inline-start:1.5rem}
.tally dt{font-size:.8rem;color:var(--soft)}
.tally dd{margin:0;font-family:var(--serif);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--go)} .neg{color:var(--stop)}

/* uses */
.uses{display:grid;gap:2.25rem}
.use{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:.75rem 2rem}
.use > *{min-width:0}
.use h3,.use .desc{grid-column:1}
.use .desc{color:var(--soft)}
.use .chat{grid-column:2;grid-row:1 / span 3}
.chat{display:grid;gap:.6rem;align-content:start}
.ask{border:1px solid var(--rule);background:var(--wash);border-radius:var(--r);padding:.8rem .95rem;font-family:var(--mono);font-size:.88rem;line-height:1.55}
.ask small{display:block;font-family:var(--sans);font-size:.75rem;font-weight:600;color:var(--soft);margin-bottom:.25rem}
.ask .caret{display:inline-block;width:.5ch;height:1.05em;background:var(--brass);vertical-align:text-bottom;margin-inline-start:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.line{font-size:.9rem;color:var(--soft);padding-inline-start:.95rem;border-inline-start:2px solid var(--needle)}
.line b{color:var(--ink);font-weight:600}
@media (max-width:640px){.use{grid-template-columns:1fr}.use .chat{grid-column:1;grid-row:auto}}

/* risks */
.risk{border-bottom:1px solid var(--rule)}
.risk:first-child{border-top:1px solid var(--rule)}
.risk summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:1rem;padding-block:1.1rem}
.risk summary::-webkit-details-marker{display:none}
.risk summary:hover h3{color:var(--needle)}
.risk summary::after{content:"";width:.55rem;height:.55rem;border-inline-end:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);flex:none;margin-inline-start:auto;transition:transform .2s}
.risk[open] summary::after{transform:rotate(-135deg)}
.risk-in{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem 2.5rem;padding-bottom:1.5rem}
.risk-in > *{min-width:0}
.risk-in .what{grid-column:1/-1;color:var(--soft)}
.risk-in h4{font-size:.82rem;font-weight:700;margin:0 0 .4rem;color:var(--needle)}
.risk-in ul{margin:0;padding-inline-start:1.1rem;display:grid;gap:.3rem}
@media (max-width:640px){.risk-in{grid-template-columns:1fr}}

/* scenarios */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:1.6rem;display:grid;gap:1.25rem}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:4px}
.pips button{width:1.6rem;height:1.1rem;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.pips button::before{content:"";width:100%;height:3px;background:var(--rule)}
.pips button[aria-current="true"]::before{background:var(--ink)}
.pips button.seen::before{background:var(--soft)}
.situation{font-family:var(--serif);font-size:1.3rem;line-height:1.4;font-weight:600}
html[dir="rtl"] .situation{line-height:1.8}
.choices{display:grid;gap:.5rem}
.choice{text-align:start;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;display:flex;gap:.8rem;align-items:baseline;transition:border-color .15s}
.choice:hover{border-color:var(--ink)}
.choice:active{transform:translateY(1px)}
.choice .key{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--soft);flex:none}
.choice[aria-pressed="true"]{border-color:var(--v);box-shadow:inset 0 0 0 1px var(--v)}
.result{padding:.9rem 1rem;border-inline-start:3px solid var(--v);background:color-mix(in srgb,var(--v) 9%,transparent)}
.result strong{color:var(--v);margin-inline-end:.4rem}
.panel-nav{display:flex;justify-content:space-between;gap:.75rem}

/* rules */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:start;font-size:.8rem;font-weight:700;color:var(--soft);padding:.5rem .75rem .5rem 0;border-bottom:1.5px solid var(--ink)}
td{padding:.7rem .75rem .7rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
td:last-child,th:last-child{white-space:nowrap;padding-inline-end:0}
tbody tr:hover td{background:var(--wash)}
.status{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:600;color:var(--c)}
.status::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.footnote{margin-top:1.25rem;font-size:.92rem;color:var(--soft);max-width:44rem;display:grid;gap:.6rem}

/* alerts */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.25rem}
.filters button{background:none;border:1px solid var(--rule);border-radius:999px;padding:.3rem .9rem;font-size:.85rem;cursor:pointer;min-height:2rem}
.filters button:hover{border-color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters .n{font-variant-numeric:tabular-nums;opacity:.65;margin-inline-start:.3rem}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:1.25rem;padding-block:1rem;border-top:1px solid var(--rule)}
.log li:last-child{border-bottom:1px solid var(--rule)}
.lvl{font-size:.82rem;font-weight:700;color:var(--c);display:flex;align-items:center;gap:.45rem}
.lvl::before{content:"";width:.6rem;height:.6rem;background:var(--c)}
.log .meta{font-size:.8rem;color:var(--soft);margin-top:.2rem}
.log p{font-size:.93rem;color:var(--soft);margin-top:.25rem}
.ex{font-size:.72rem;font-weight:600;color:var(--soft);border:1px solid var(--rule);border-radius:2px;padding:0 .35rem;margin-inline-start:.4rem;vertical-align:.12em;font-family:var(--sans)}
@media (max-width:560px){.log li{grid-template-columns:1fr;gap:.3rem}}

/* sources */
.refs{list-style:none;margin:0;padding:0;counter-reset:r}
.refs li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.25rem 1rem;padding-block:1rem;border-top:1px solid var(--rule);scroll-margin-top:5rem}
.refs li:last-child{border-bottom:1px solid var(--rule)}
.refs li:target{background:color-mix(in srgb,var(--brass) 12%,transparent)}
.refs .no{font-family:"IBM Plex Mono",monospace;color:var(--brass);font-weight:500}
.refs .cite{direction:ltr;text-align:start;unicode-bidi:isolate}
html[dir="rtl"] .refs .cite{text-align:right}
.refs .cite a{font-weight:600}
.refs .used{grid-column:2;font-size:.85rem;color:var(--soft)}

/* reviews */
.rv-summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;padding-bottom:1.1rem;border-bottom:1.5px solid var(--ink)}
.rv-avg{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rv-summary .muted{font-size:.9rem}
.stars{display:inline-flex;gap:2px;color:var(--brass);letter-spacing:0;font-size:1rem;line-height:1}
.stars .off{color:var(--rule)}
.rv-list{list-style:none;margin:0;padding:0}
.rv-list li{padding-block:1.15rem;border-bottom:1px solid var(--rule);display:grid;gap:.45rem}
.rv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;font-size:.85rem;color:var(--soft)}
.rv-meta strong{color:var(--ink);font-size:.95rem}
.rv-text{max-width:62ch;white-space:pre-line;overflow-wrap:anywhere}
.rv-empty{padding-block:1.4rem;color:var(--soft);border-bottom:1px solid var(--rule)}
.rv-more{margin-top:1rem}
.rv-form{margin-top:2.5rem;padding:1.5rem;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);display:grid;gap:1.15rem;max-width:40rem}
.rv-form h3{font-size:1.2rem}
.field{display:grid;gap:.35rem}
.field label,.field .lab{font-weight:600;font-size:.92rem}
.field .hint{font-size:.8rem;color:var(--soft);font-weight:400}
.field input[type="text"]{width:100%;padding:.65rem .75rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit}
.field input[type="text"]:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 35%,transparent)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.charcount{font-size:.8rem;color:var(--soft);text-align:end;font-variant-numeric:tabular-nums}
.fb{display:grid;gap:1.25rem;max-width:36rem}
.scale{display:flex;gap:.4rem}
.scale button{width:2.9rem;height:2.9rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.scale button:hover{border-color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.scale-ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft);max-width:15.6rem;margin-top:.35rem}
.fb label{font-weight:600;font-size:.92rem}
textarea{width:100%;min-height:6rem;margin-top:.4rem;padding:.75rem;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);font:inherit;resize:vertical}

function renderDial(){
  const needle = $("needle"), latest = state.scores[state.scores.length - 1];
  if (latest === undefined){
    needle.classList.add("idle");
    needle.style.setProperty("--a2", "128deg");
    needle.style.transform = "rotate(138deg)";
    $("dialCap").textContent = UI.dial_none[L()];
  } else {
    needle.classList.remove("idle");
    needle.style.transform = `rotate(${180 - latest * 36}deg)`;
    $("dialCap").textContent = UI.dial_score[L()].replace("{s}", latest);
  }
}

    const opts = q.o.map((o, k) => {
      let cls = "", tag = "";
      if (state.graded && k === q.a){ cls = "right"; tag = `<span class="mark-label" style="color:var(--go)">${ui(state.answers[n] === k ? "right" : "answer")}</span>`; }
      else if (state.graded && state.answers[n] === k){ cls = "miss"; tag = `<span class="mark-label" style="color:var(--stop)">${ui("wrong")}</span>`; }
      return `<label class="opt ${cls}" for="q${n}-${k}"><input type="radio" id="q${n}-${k}" name="q${n}" value="${k}"${state.answers[n] === k ? " checked" : ""}${state.graded ? " disabled" : ""}><span>${tr(o)}</span>${tag}</label>`;
    }).join("");
    return `<li><fieldset><legend>${tr(q.q)}</legend>${opts}${state.graded ? `<p class="why">${tr(q.e)}</p>` : ""}</fieldset></li>`;
  }).join("");

  const done = state.answers.filter(a => a !== null).length;
  let foot = state.graded
    ? `<div class="row"><button type="button" class="btn quiet" id="again">${ui("retake")}</button><span class="muted">${ui("after")}</span></div>`
    : `<div class="row"><button type="submit" class="btn">${ui("submit")}</button><span class="count" id="count" aria-live="polite">${UI.answered[L()].replace("{n}", done)}</span>${state.missing ? `<span class="warn" role="alert">${ui("missing")}</span>` : ""}</div>`;

  if (state.scores.length){
    const first = state.scores[0], last = state.scores[state.scores.length - 1];
    const diff = Math.round((last - first) / QUIZ.length * 100);
    foot += `<dl class="tally">
      <div><dt>${ui("first")}</dt><dd>${first}/5</dd></div>
      <div><dt>${ui("latest")}</dt><dd>${last}/5</dd></div>
      <div><dt>${ui("change")}</dt><dd class="${diff > 0 ? "pos" : diff < 0 ? "neg" : ""}">${diff > 0 ? "+" : ""}${diff}%</dd></div></dl>`;
  }
  $("quiz").innerHTML = `<ol class="qs">${items}</ol>${foot}`;
  const again = $("again");
  if (again) again.addEventListener("click", () => {
    state.answers.fill(null); state.graded = false; renderQuiz();
    $("check").scrollIntoView({block: "start"});
  });
}

$("quiz").addEventListener("change", e => {
  const m = /^q(\d+)$/.exec(e.target.name || "");
  if (!m) return;
  state.answers[Number(m[1])] = Number(e.target.value);
  const count = $("count");
  if (count) count.textContent = UI.answered[L()].replace("{n}", state.answers.filter(a => a !== null).length);
});
$("quiz").addEventListener("submit", e => {
  e.preventDefault();
  if (state.answers.includes(null)){ state.missing = true; renderQuiz(); return; }
  state.missing = false;
  state.graded = true;
  state.scores.push(state.answers.filter((a, n) => a === QUIZ[n].a).length);
  saved.write("sac-scores", state.scores);
  renderQuiz(); renderDial();
});

/* Reviews: submitted to a Google Form, shown from a published sheet that lists only approved rows. */
const REVIEWS = {
  csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTa0O4g6fCDCloLVDl17d2xAJMJFiiNmoWU5o-xV-SkPPUvGBDzAwb_xIKzFxwl9eUSrQ_gCr_WpOIX/pub?gid=2067502261&single=true&output=csv",
  form: "https://docs.google.com/forms/d/e/1FAIpQLSd884dAcGqGNZFdKAJj38c9M0xEcGvWKXuJLK4P_JP6_TLlcg/formResponse",
  fields: {text: "entry.678303481", rating: "entry.58840453", name: "entry.249198145", lang: "entry.1083916437"},
  shownAtFirst: 6,
  minLength: 10,
  maxLength: 600
};
const reviews = {status: "loading", items: [], showAll: false, sending: false, error: null};

function parseCSV(text){
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (quoted){
      if (ch === '"' && text[i + 1] === '"'){ cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function parseSheetDate(value){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(value || "");
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0));
  return isNaN(d) ? null : d;
}

async function loadReviews(){
  try {
    const res = await fetch(REVIEWS.csv, {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    const [header, ...rows] = parseCSV(await res.text());
    const col = name => (header || []).findIndex(h => h.trim().toLowerCase() === name);
    const c = {time: col("timestamp"), text: col("review"), rating: col("rating"), name: col("name")};
    reviews.items = rows.map(r => ({
      date: parseSheetDate(r[c.time]),
      text: (r[c.text] || "").trim().slice(0, REVIEWS.maxLength),
      rating: Math.round(Number(r[c.rating])),
      name: (r[c.name] || "").trim().slice(0, 40)
    })).filter(r => r.text && r.rating >= 1 && r.rating <= 5)
      .sort((a, b) => (b.date || 0) - (a.date || 0));
    reviews.status = "ready";
  } catch (err) {
    reviews.status = "error";
  }
  renderReviews();
}

function starsHTML(n){
  return `<span class="stars" role="img" aria-label="${n} / 5">${[1,2,3,4,5].map(i => `<span class="${i <= n ? "" : "off"}" aria-hidden="true">★</span>`).join("")}</span>`;
}

function renderReviews(){
  const board = $("rvBoard");
  if (reviews.status === "loading"){ board.innerHTML = `<p class="rv-empty">${ui("rv_loading")}</p>`; return; }
  if (reviews.status === "error"){ board.innerHTML = `<p class="rv-empty">${ui("rv_error")}</p>`; return; }
  const items = reviews.items;
  if (!items.length){ board.innerHTML = `<p class="rv-empty">${ui("rv_empty")}</p>`; return; }
  const avg = items.reduce((s, r) => s + r.rating, 0) / items.length;
  const shown = reviews.showAll ? items : items.slice(0, REVIEWS.shownAtFirst);
  const fmt = new Intl.DateTimeFormat(state.lang === "ar" ? "ar-SA-u-ca-gregory" : "en-GB", {month: "long", year: "numeric"});
  board.innerHTML = `
    <div class="rv-summary">
      <span class="rv-avg">${avg.toFixed(1)}</span>
      ${starsHTML(Math.round(avg))}
      <span class="muted">${items.length === 1 ? ui("rv_count1") : UI.rv_count[L()].replace("{n}", items.length)}</span>
    </div>
    <ul class="rv-list">${shown.map(() => `<li><div class="rv-meta"><strong></strong><span class="stars-slot"></span><span class="when"></span></div><p class="rv-text" dir="auto"></p></li>`).join("")}</ul>
    ${!reviews.showAll && items.length > REVIEWS.shownAtFirst ? `<button type="button" class="btn quiet rv-more" id="rvMore">${UI.rv_more[L()].replace("{n}", items.length)}</button>` : ""}`;
  board.querySelectorAll(".rv-list li").forEach((li, n) => {
    const r = shown[n];
    const who = li.querySelector("strong");
    who.textContent = r.name || UI.rv_anon[L()];
    who.setAttribute("dir", "auto");
    li.querySelector(".stars-slot").outerHTML = starsHTML(r.rating);
    li.querySelector(".when").textContent = r.date ? fmt.format(r.date) : "";
    li.querySelector(".rv-text").textContent = r.text;
  });
  const more = $("rvMore");
  if (more) more.addEventListener("click", () => { reviews.showAll = true; renderReviews(); });
}

function sentRecently(){
  const at = saved.read("sac-review-at", 0);
  return Date.now() - at < 24 * 60 * 60 * 1000;
}

function renderReviewForm(){
  const form = $("rvForm");
  if (state.sent){ form.innerHTML = `<p class="done" role="status">${ui("rv_done")}</p>`; return; }
  if (sentRecently()){ form.innerHTML = `<p class="done" role="status">${ui("rv_wait")}</p>`; return; }
  form.innerHTML = `
    <h3>${ui("rv_form_h")}</h3>
    <div class="field">
      <span class="lab" id="rvRateLabel">${ui("fb_q")}</span>
      <div class="scale" role="group" aria-labelledby="rvRateLabel">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-pressed="${state.rating === n}">${n}</button>`).join("")}</div>
      <div class="scale-ends"><span>${ui("fb_low")}</span><span>${ui("fb_high")}</span></div>
    </div>
    <div class="field">
      <label for="rvText">${ui("rv_text")} <span class="hint">${ui("rv_text_hint")}</span></label>
      <textarea id="rvText" maxlength="${REVIEWS.maxLength}" dir="auto">${esc(state.comment)}</textarea>
      <span class="charcount" id="rvCount">${state.comment.length} / ${REVIEWS.maxLength}</span>
    </div>
    <div class="field">
      <label for="rvName">${ui("rv_name")} <span class="hint">${ui("rv_name_hint")}</span></label>
      <input type="text" id="rvName" maxlength="40" autocomplete="off" dir="auto" value="${esc(state.reviewName || "")}">
    </div>
    <div class="hp" aria-hidden="true"><label for="rvWebsite">Website</label><input type="text" id="rvWebsite" tabindex="-1" autocomplete="off"></div>
    <p class="muted" style="font-size:.85rem">${ui("rv_privacy")}</p>
    <div class="row" style="margin-top:0">
      <button type="submit" class="btn"${reviews.sending ? " disabled" : ""}>${reviews.sending ? ui("rv_sending") : ui("rv_send")}</button>
      ${reviews.error ? `<span class="warn" role="alert">${ui(reviews.error)}</span>` : ""}
    </div>`;
  const keep = () => { state.comment = $("rvText").value; state.reviewName = $("rvName").value; };
  form.querySelectorAll(".scale button").forEach(b => b.addEventListener("click", () => {
    keep(); state.rating = Number(b.dataset.n);
    if (reviews.error === "rv_need_rating") reviews.error = null;
    renderReviewForm();
  }));
  $("rvText").addEventListener("input", e => { $("rvCount").textContent = `${e.target.value.length} / ${REVIEWS.maxLength}`; });
}

$("rvForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (reviews.sending) return;
  state.comment = $("rvText").value.trim();
  state.reviewName = $("rvName").value.trim();
  if (!state.rating){ reviews.error = "rv_need_rating"; renderReviewForm(); return; }
  if (state.comment.length < REVIEWS.minLength){ reviews.error = "rv_need_text"; renderReviewForm(); return; }
  if ($("rvWebsite").value){ state.sent = true; renderReviewForm(); return; }
  reviews.error = null; reviews.sending = true; renderReviewForm();
  const body = new URLSearchParams();
  body.set(REVIEWS.fields.text, state.comment);
  body.set(REVIEWS.fields.rating, String(state.rating));
  body.set(REVIEWS.fields.name, state.reviewName);
  body.set(REVIEWS.fields.lang, state.lang);
  try {
    await fetch(REVIEWS.form, {method: "POST", mode: "no-cors", body});
    saved.write("sac-review-at", Date.now());
    state.sent = true;
  } catch (err) {
    reviews.error = "rv_fail";
  }
  reviews.sending = false;
  renderReviewForm();
});

const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : darkQuery.matches;
function syncThemeLabel(){ $("themeBtn").textContent = isDark() ? UI.light[L()] : UI.dark[L()]; }
$("themeBtn").addEventListener("click", () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; syncThemeLabel(); });
if (darkQuery.addEventListener) darkQuery.addEventListener("change", syncThemeLabel);

$("langBtn").addEventListener("click", () => {
  state.lang = state.lang === "ar" ? "en" : "ar";
  saved.write("sac-lang", state.lang);
  setLanguage();
});

(function drawTicks(){
  let lines = "";
  for (let n = 0; n < 72; n++){
    const rad = n * 5 * Math.PI / 180, big = n % 18 === 0, r1 = big ? 82 : (n % 2 ? 92 : 88);
    const p = r => [(120 + r * Math.sin(rad)).toFixed(1), (120 - r * Math.cos(rad)).toFixed(1)];
    const [x1, y1] = p(r1), [x2, y2] = p(96);
    lines += `<line class="tk${big ? " big" : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  $("ticks").innerHTML = lines;
})();

(function trackSection(){
  if (!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll(".nav a")];
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      links.forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + entry.target.id ? "true" : "false"));
    });
  }, {rootMargin: "-40% 0px -55% 0px"});
  document.querySelectorAll("main section[id]").forEach(s => observer.observe(s));
})();

setLanguage();
loadReviews();
</script>
